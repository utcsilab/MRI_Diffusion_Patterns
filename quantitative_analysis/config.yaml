# Configuration for the rebuttal statistical analysis pipeline.

seed: 42
bootstrap_resamples: 10000
alpha: 0.05

# Map anatomy keys to the two CSV files for that anatomy.
# Filenames verified against the supplied data.
data_files:
  t2_brain:
    diffusion: data/brain_results.csv
    modl:      data/MoDL_brain_results.csv
  pd_knee:
    diffusion: data/pd_results.csv
    modl:      data/MoDL_pd_results.csv
  pdfs_knee:
    diffusion: data/pdfs_results.csv
    modl:      data/MoDL_pdfs_results.csv
  all_knee:
    diffusion: data/combined_results.csv
    modl:      data/MoDL_combined_results.csv

# Column to minimize when picking the canonical DOGG ("ours") row per (anatomy, acceleration).
# This rule is stated in the manuscript.
ours_selection_metric: "mean nrmse"

# Method labels (do not change unless renaming throughout the manuscript).
methods:
  end_to_end:
    - modl+loupe
    - modl+poisson
  other_diffusion:
    - diffusion+loupe
    - diffusion+poisson
  ours: ours

# Metric direction. Used to flip signs so positive paired diff always means "ours better".
metric_direction:
  ssim:  higher_better
  psnr:  higher_better
  nrmse: lower_better
